[workspace]
resolver = "2"
members = [
  "crates/lucy-core",
  "crates/lucy-agent",
  "crates/lucy-tools",
  "crates/lucy-mcp",
  "crates/lucy-tui",
  "crates/lucy-cli",
  "crates/lucy-stt",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Krish Patel"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
