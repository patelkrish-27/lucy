# Lucy configuration
# LLM API keys for any brand can be set here or via env vars.
# Supported envs: LUCY_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, LLM_API_KEY
# Endpoint (base_url) makes any OpenAI-compatible provider work.

[general]
startup_screen = "mascot"
compact_after_command = true

[models]
# Main = OpenChat, Cheap = Gemini 3.5 Flash-Lite (per your request)
main = "openchat"
planner = "gemini-3.5-flash-lite"
hyprfast_command = "gemini-3.5-flash-lite"

# --- Per-model credentials (recommended) ---
# Main (OpenChat) — put your OpenChat API key + endpoint here
# main_api_key = "openchat-sk-..."
# main_base_url = "https://api.openchat.ai/v1"

# Cheap (Gemini 3.5 Flash-Lite) — direct Gemini key + OpenAI-compatible endpoint
# cheap_api_key = "AIza..."  # your Gemini API key
# cheap_base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"

# --- Legacy generic fallback (used if per-model not set) ---
# api_key = "sk-..."  # fallback for both models
# base_url = "https://api.openai.com/v1"

[planner]
max_subtasks = 32
max_depth = 8
verify_state = true
parallel = true
replan_on_failure = true

[voice]
provider = "groq"
model = "whisper-large-v3-turbo"
# language = "en"
push_to_talk = "f2"
# api_key = "gsk_..."  # Voice STT key (Groq) — also via GROQ_API_KEY / LUCY_STT_API_KEY env

[hyprfast]
command = "hyprfast"
args = ["mcp"]
max_candidates = 8
batching = true
parallel = true
verify_actions = true

[appearance]
theme = "lucy"
animations = true
activity_verbosity = "normal"

[sessions]
resume = true
max_history = 100
# file = "/custom/path/session.json"
# dir = "/custom/path/sessions"  # opencode-style multi-session store (default: ~/.local/state/lucy/sessions)

[approvals]
# Permission mode for computer + shell + file tools:
# - "write" (default) — ask before state-changing tools (each new tool asks once; `a` whitelists that tool)
# - "never" (auto) — hands-free, never ask — same as `/auto on` or LUCY_AUTO_APPROVE=1
# - "always" — ask before every tool
mode = "write"
